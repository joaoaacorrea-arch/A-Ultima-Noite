name: Gerar APK 3D Godot
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  godot-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extrair projeto 3D
        run: unzip -q UltimaNoite_Godot_3D.zip -d godot-project
      - name: Preparar ferramentas de teste
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep xvfb libgl1-mesa-dri
      - name: Testar e gerar APK Godot
        working-directory: godot-project/UltimaNoite
        run: bash ci/build.sh
      - name: Disponibilizar APK 3D
        uses: actions/upload-artifact@v4
        with:
          name: A_Ultima_Noite_3D_APK
          path: |
            godot-project/UltimaNoite/build/A_Ultima_Noite_3D.apk
            godot-project/UltimaNoite/build/SHA256.txt
          if-no-files-found: error
          retention-days: 1
      - name: Relatorios e previas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot_3D_Verificacao
          path: |
            godot-project/UltimaNoite/build/*.log
            godot-project/UltimaNoite/preview*.png
          if-no-files-found: ignore
          retention-days: 1
