name: Gerar APK 3D Godot
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  godot-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extrair projeto 3D
        run: unzip -q UltimaNoite_Godot_3D.zip -d godot-project
      - name: Preparar ferramentas de teste
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep xvfb libgl1-mesa-dri
      - name: Testar e gerar APK Godot
        working-directory: godot-project/UltimaNoite
        run: bash ci/build.sh
      - name: Preparar emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar toques no Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd godot-project/UltimaNoite && python3 ci/android_ui_test.py
      - name: Disponibilizar APK 3D
        uses: actions/upload-artifact@v4
        with:
          name: A_Ultima_Noite_3D_APK
          path: |
            godot-project/UltimaNoite/build/A_Ultima_Noite_3D.apk
            godot-project/UltimaNoite/build/SHA256.txt
          if-no-files-found: error
          retention-days: 1
      - name: Relatorios e previas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot_3D_Verificacao
          path: |
            godot-project/UltimaNoite/build/*.log
            godot-project/UltimaNoite/build/android_test/
            godot-project/UltimaNoite/preview*.png
          if-no-files-found: ignore
          retention-days: 1
